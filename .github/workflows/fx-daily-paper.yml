name: FX Daily Paper Trade

on:
  workflow_dispatch:

  # GitHub Actions の cron は UTC
  # JST 16:15 = UTC 07:15
  # JST 16:45 = UTC 07:45
  #
  # 16:15で通常実行、16:45はGitHub Actions遅延やyfinance更新遅れ対策の保険
  schedule:
    - cron: "15 7 * * 1-5"
    - cron: "45 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: fx-daily-paper
  cancel-in-progress: false

jobs:
  fx-daily-paper:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo
      PYTHONIOENCODING: utf-8
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Check files
        run: |
          test -f fx_v810_dual_daily_signal.py
          test -f fx_v811_paper_trade.py
          test -f fx_v812_signal_diagnostics.py

      - name: Syntax check
        run: |
          python -m py_compile fx_v810_dual_daily_signal.py
          python -m py_compile fx_v811_paper_trade.py
          python -m py_compile fx_v812_signal_diagnostics.py

      - name: Run daily signal
        run: |
          python fx_v810_dual_daily_signal.py

      - name: Run signal diagnostics
        run: |
          python fx_v812_signal_diagnostics.py

      - name: Run paper trade
        run: |
          python fx_v811_paper_trade.py

      - name: Show generated files
        run: |
          ls -la

          echo "---- v810 candidates ----"
          test -f fx_v810_daily_candidates.csv && cat fx_v810_daily_candidates.csv || true

          echo "---- v810 summary ----"
          test -f fx_v810_daily_summary.csv && cat fx_v810_daily_summary.csv || true

          echo "---- v812 diagnostics ----"
          test -f fx_v812_signal_diagnostics.csv && cat fx_v812_signal_diagnostics.csv || true

          echo "---- v812 diagnostics summary ----"
          test -f fx_v812_signal_diagnostics_summary.csv && cat fx_v812_signal_diagnostics_summary.csv || true

          echo "---- v811 positions ----"
          test -f fx_v811_positions.csv && cat fx_v811_positions.csv || true

          echo "---- v811 trades ----"
          test -f fx_v811_trades.csv && cat fx_v811_trades.csv || true

          echo "---- v811 equity ----"
          test -f fx_v811_equity.csv && cat fx_v811_equity.csv || true

          echo "---- v811 report ----"
          test -f fx_v811_daily_report.csv && cat fx_v811_daily_report.csv || true

      - name: Commit paper trade state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f \
            fx_v810_daily_candidates.csv \
            fx_v810_daily_summary.csv \
            fx_v812_signal_diagnostics.csv \
            fx_v812_signal_diagnostics_summary.csv \
            fx_v811_positions.csv \
            fx_v811_trades.csv \
            fx_v811_equity.csv \
            fx_v811_daily_report.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update FX paper trade state [skip ci]"
            git push
          fi
